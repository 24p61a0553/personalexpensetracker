# =====================================================================
# MySQL Database Configuration for Personal Expense Tracker
# =====================================================================
# This file is bundled inside the WAR.
#
# Flexible Configuration Priority:
# 1. Environment Variables:
#    DATABASE_URL (e.g. mysql://user:pass@host:port/expense_tracker)
#    OR DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS
# 2. JVM System Properties (-Ddb.pass=..., -Ddb.user=..., etc.)
# 3. External Tomcat configuration: <TOMCAT_HOME>/conf/db.properties
# 4. External working directory configuration: ./db.properties
# 5. This fallback properties file
# =====================================================================

db.host=localhost
db.port=3306
db.name=expense_tracker
db.user=root
db.pass=
