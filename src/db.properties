# =====================================================================
# Database Configuration Template (Placeholders Only - No Secrets)
# =====================================================================
# Real credentials must NEVER be stored in this file or committed to Git.
# Supply database credentials exclusively via Environment Variables:
#   - DB_HOST (e.g. localhost or your cloud host)
#   - DB_PORT (e.g. 3306)
#   - DB_NAME (e.g. expense_tracker)
#   - DB_USER (e.g. your_db_user)
#   - DB_PASS (e.g. your_db_password)
# Or via a single DATABASE_URL (e.g. mysql://user:pass@host:port/dbname)
# =====================================================================
db.host=${DB_HOST}
db.port=${DB_PORT}
db.name=${DB_NAME}
db.user=${DB_USER}
db.pass=${DB_PASS}
