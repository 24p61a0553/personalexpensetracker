version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense_tracker_app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=expense_tracker
      - DB_USER=root
      - DB_PASS=secret123
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: expense_tracker_db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret123
      - MYSQL_DATABASE=expense_tracker
    volumes:
      - db_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

volumes:
  db_data:
