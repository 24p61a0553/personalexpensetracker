# =====================================================================
# Personal Expense Tracker - Ant Build Configuration
# =====================================================================

app.name=PersonalExpenseTracker
app.version=1.0.0

# Source and Web Directories
src.dir=src
web.dir=WebContent
webinf.dir=${web.dir}/WEB-INF
lib.dir=lib
dist.dir=dist
build.dir=build
classes.dir=${build.dir}/classes

# Java compiler settings
javac.debug=true
javac.deprecation=false
javac.optimize=true
javac.source=1.8
javac.target=1.8
javac.encoding=UTF-8

# Tomcat Deployment Path (Local Windows Tomcat 9)
tomcat.home=C:/apache-tomcat-9
tomcat.webapps=${tomcat.home}/webapps
